[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
requires-python = ">=3.11"
description = "Offline candidate retrieval and LightGBM business entity resolution"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-base.txt", "requirements-model.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ber = "ber.cli:main"
